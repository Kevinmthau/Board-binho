<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Board Game Font";
        src: url("/fonts/board-game-font.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        width: 1536px;
        height: 864px;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas width="1536" height="864"></canvas>
    <script type="module">
      import { drawPitchArt } from "/src/pitch-art.ts";
      await document.fonts.load('180px "Board Game Font"');
      drawPitchArt(document.querySelector("canvas"), true);
      document.documentElement.dataset.ready = "true";
    </script>
  </body>
</html>
